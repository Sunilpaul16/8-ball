<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Magic 8-Ball</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            border-radius: 10px;
            padding: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        #question-input {
            width: 100%;
            padding: 0.5rem;
            margin-bottom: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        #ask-button {
            width: 100%;
            padding: 0.5rem;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        #ask-button:hover {
            background-color: #45a049;
        }
        #answer {
            text-align: center;
            font-size: 1.2rem;
            margin-top: 1rem;
            font-weight: bold;
            color: #333;
        }
        #history {
            margin-top: 2rem;
        }
        #history h2 {
            color: #333;
        }
        #history-list {
            list-style-type: none;
            padding: 0;
        }
        #history-list li {
            margin-bottom: 0.5rem;
            padding: 0.5rem;
            background-color: #f9f9f9;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Magic 8-Ball</h1>
        <input type="text" id="question-input" placeholder="Ask your question...">
        <button id="ask-button">Ask the Magic 8-Ball</button>
        <div id="answer"></div>
        <div id="history">
            <h2>Previous Questions</h2>
            <ul id="history-list"></ul>
        </div>
    </div>

    <script>
        const answers = [
            "It is certain",
            "It is decidedly so",
            "Without a doubt",
            "Yes, definitely",
            "You may rely on it",
            "As I see it, yes",
            "Most likely",
            "Outlook good",
            "Yes",
            "Signs point to yes",
            "Reply hazy, try again",
            "Ask again later",
            "Better not tell you now",
            "Cannot predict now",
            "Concentrate and ask again",
            "Don't count on it"
        ];

        const questionInput = document.getElementById('question-input');
        const askButton = document.getElementById('ask-button');
        const answerElement = document.getElementById('answer');
        const historyList = document.getElementById('history-list');
        let questionHistory = [];


        askButton.addEventListener('click', () => {
            const question = questionInput.value.trim();
            if (question) {
                const randomAnswer = answers[Math.floor(Math.random() * answers.length)];


                answerElement.textContent = randomAnswer;
                updateHistory(question, randomAnswer);
                questionInput.value = '';
            }
        });

        function updateHistory(question, answer) {
            questionHistory.unshift(`Q: ${question} - A: ${answer}`);
            if (questionHistory.length > 10) {
                questionHistory.pop();
            }
            displayHistory();
        }

        function displayHistory() {
            historyList.innerHTML = '';
            questionHistory.forEach(item => {
                const li = document.createElement('li');
                li.textContent = item;
                historyList.appendChild(li);
            });
        }
    </script>
</body>
</html>
